<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Fauqiyya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="assets/img/logo.png" alt="Toko Fauqiyya" width="120" class="img-fluid">
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-success me-2" data-bs-toggle="modal" data-bs-target="#cartModal">
                    <i class="bi bi-cart"></i> 
                    <span id="cartCount" class="badge bg-danger">0</span>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="navbar-nav">
                    <a href="admin/login.php" class="btn btn-outline-primary">Login Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Produk Kami</h2>
        <div class="row" id="product-list">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Keranjang Belanja</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItems"></div>
                    <div class="text-end mt-3">
                        <h5>Total: Rp <span id="cartTotal">0</span></h5>
                    </div>
                    <hr>
                    <form id="customerForm" class="mt-3">
                        <h5>Informasi Pembeli</h5>
                        <div class="mb-3">
                            <label class="form-label">Nama</label>
                            <input type="text" class="form-control" id="customerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alamat Lengkap</label>
                            <textarea class="form-control" id="customerAddress" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-success" onclick="checkoutViaWhatsApp()">Checkout via WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle me-2"></i>
                    Produk berhasil ditambahkan ke keranjang
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const waNumber = ''; // Tidak bisa pakai env karena ini file statis (backup)
        let cart = [];

        function updateCartDisplay() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            cartCount.textContent = cart.length;
            
            let total = 0;
            cartItems.innerHTML = cart.map((item, index) => {
                total += item.price * item.quantity;
                return `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <h6>${item.name}</h6>
                            <p class="mb-0">Rp ${item.price.toLocaleString('id-ID')} x ${item.quantity}</p>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="removeFromCart(${index})">Hapus</button>
                    </div>
                `;
            }).join('');
            
            cartTotal.textContent = total.toLocaleString('id-ID');
        }

        function addToCart(product, price, stock) {
            const qtyInput = document.getElementById(`qty-${product}`);
            const qty = parseInt(qtyInput.value);
            
            if (qty <= 0) {
                alert('Jumlah pembelian harus minimal 1');
                return;
            }
            
            if (qty > stock) {
                alert('Jumlah pembelian melebihi stok yang tersedia');
                return;
            }
            
            cart.push({
                name: product,
                price: price,
                quantity: qty
            });
            
            updateCartDisplay();
            qtyInput.value = 1;

            // Show success toast
            const toast = new bootstrap.Toast(document.getElementById('successToast'));
            toast.show();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function checkoutViaWhatsApp() {
            if (cart.length === 0) {
                alert('Keranjang belanja masih kosong');
                return;
            }

            // Get customer information
            const customerName = document.getElementById('customerName').value.trim();
            const customerAddress = document.getElementById('customerAddress').value.trim();

            // Validate form
            if (!customerName || !customerAddress) {
                alert('Mohon lengkapi informasi pembeli');
                return;
            }

            let message = "Halo, saya ingin memesan:\n\n";
            let total = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                message += `${item.name} (${item.quantity}x) = Rp ${subtotal.toLocaleString('id-ID')}\n`;
            });

            message += `\nTotal: Rp ${total.toLocaleString('id-ID')}`;
            message += `\n\nInformasi Pembeli:`;
            message += `\nNama: ${customerName}`;
            message += `\nAlamat: ${customerAddress}`;
            
            const waURL = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
            window.open(waURL, '_blank');
            
            // Clear cart and form after checkout
            cart = [];
            document.getElementById('customerForm').reset();
            updateCartDisplay();
            document.querySelector('#cartModal .btn-close').click();
        }

        fetch('products.php')
            .then(response => response.json())
            .then(products => {
                const productList = document.getElementById('product-list');
                if (products.length > 0) {
                    products.forEach(product => {
                        productList.innerHTML += `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                                <div class="card h-100">
                                    <img src="assets/img/${product.image}" class="card-img-top" alt="${product.name}" style="object-fit: cover; height: 200px;">
                                    <div class="card-body">
                                        <h5 class="card-title">${product.name}</h5>
                                        <p class="card-text fw-bold text-primary">Rp ${Number(product.price).toLocaleString('id-ID')}</p>
                                        <p class="card-text ${product.stock > 0 ? 'text-success' : 'text-danger'}">
                                            ${product.stock > 0 ? `Stok: ${product.stock}` : 'Stok Habis'}
                                        </p>
                                        ${product.stock > 0 ? `
                                            <div class="mb-3">
                                                <label class="form-label">Jumlah:</label>
                                                <div class="input-group">
                                                    <button class="btn btn-outline-secondary" type="button" onclick="decrementQty('${product.name}')">-</button>
                                                    <input type="number" class="form-control text-center" id="qty-${product.name}" 
                                                        min="1" max="${product.stock}" value="1">
                                                    <button class="btn btn-outline-secondary" type="button" onclick="incrementQty('${product.name}', ${product.stock})">+</button>
                                                </div>
                                            </div>
                                            <button class="btn btn-primary w-100 mb-2" 
                                                onclick="addToCart('${product.name}', ${product.price}, ${product.stock})">
                                                Tambah ke Keranjang
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>`;
                    });
                } else {
                    productList.innerHTML = '<div class="col-12"><div class="alert alert-info">Tidak ada produk yang tersedia.</div></div>';
                }
            })
            .catch(error => {
                document.getElementById('product-list').innerHTML = 
                    '<div class="col-12"><div class="alert alert-danger">Gagal memuat produk.</div></div>';
            });

        function incrementQty(productName, maxStock) {
            const input = document.getElementById(`qty-${productName}`);
            const currentValue = parseInt(input.value);
            if (currentValue < maxStock) {
                input.value = currentValue + 1;
            }
        }

        function decrementQty(productName) {
            const input = document.getElementById(`qty-${productName}`);
            const currentValue = parseInt(input.value);
            if (currentValue > 1) {
                input.value = currentValue - 1;
            }
        }
    </script>
</body>
</html>
